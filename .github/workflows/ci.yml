name: Hub CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -v

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: hub-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hub-web-dist
          path: hub-web/dist

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, collector, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hub-web-dist
          path: hub-web/dist
      - uses: actions/checkout@v4
        with:
          repository: anka-afk/astrbot_sowing_discord
          ref: main
          path: _plugin_v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install combined E2E dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r hub-backend/requirements.txt -r collector/requirements.txt aiohttp pytest pytest-asyncio
      - name: Run full-stack cross-repo E2E suite
        env:
          SOWING_PLUGIN_DIR: ${{ github.workspace }}/_plugin_v2
        run: pytest tests/e2e -v
