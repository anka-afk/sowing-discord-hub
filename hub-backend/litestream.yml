# Litestream real-time incremental SQLite backup to a DEDICATED private Cloudflare R2 bucket.
# NEVER share the same R2 bucket with publicly served media assets!
# Requires R2_BACKUP_BUCKET_NAME, R2_BACKUP_ACCESS_KEY_ID, R2_BACKUP_SECRET_ACCESS_KEY, R2_ENDPOINT_URL
dbs:
  - path: /data/hub.db
    replicas:
      - type: s3
        bucket: ${R2_BACKUP_BUCKET_NAME}
        path: backups/hub.db
        endpoint: ${R2_ENDPOINT_URL}
        region: auto
        access-key-id: ${R2_BACKUP_ACCESS_KEY_ID}
        secret-access-key: ${R2_BACKUP_SECRET_ACCESS_KEY}
        sync-interval: 10s
        snapshot-interval: 24h
        retention: 168h
        force-path-style: true
